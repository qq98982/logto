        "ASTER_PHASE1_ADMIN_ORIGIN": "http://localhost:3421"
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "test -f /run/aster/maintainer-ready && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' | nc -w 2 127.0.0.1 3001 | grep -q ' 200 OK' && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' | nc -w 2 127.0.0.1 3421 | grep -q ' 200 OK'"
        ],
        "interval": "2s",
        "timeout": "3s",
        "retries": 60
      },
      "networks": {
        "candidate-primary": {
          "ipv4_address": "172.30.241.12"
        }
      },
      "volumes": [
        "${ASTER_PHASE1_PRIMARY_CONFIG_FILE:?required}:${ASTER_PHASE1_PRIMARY_CONFIG_FILE:?required}:ro",
        "candidate-primary-keyring:/var/lib/aster/primary:ro"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=${ASTER_PHASE1_RUNTIME_UID:?required},gid=${ASTER_PHASE1_RUNTIME_GID:?required},mode=0700",
        "/run/aster:rw,noexec,nosuid,nodev,size=16m,uid=${ASTER_PHASE1_RUNTIME_UID:?required},gid=${ASTER_PHASE1_RUNTIME_GID:?required},mode=0700"
      ],
      "user": "${ASTER_PHASE1_RUNTIME_UID:?required}:${ASTER_PHASE1_RUNTIME_GID:?required}",
      "userns_mode": "host",
      "read_only": true,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "stop_signal": "SIGTERM",
      "stop_grace_period": "20s"
    },
