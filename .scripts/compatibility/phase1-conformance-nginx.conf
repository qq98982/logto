worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr warn;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    server {
        listen 8443 ssl;
        server_name conformance.aster-phase1-conformance.svc.cluster.local;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/aster/pki/suite/tls.crt;
        ssl_certificate_key /etc/aster/pki/suite/tls.key;

        client_header_buffer_size 32k;
        large_client_header_buffers 4 32k;

        location / {
            proxy_pass http://suite-server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Ssl-Cipher $ssl_cipher;
            proxy_set_header X-Ssl-Protocol $ssl_protocol;
            proxy_set_header Forwarded "by=$server_addr;for=$remote_addr;host=$host;proto=https";
            proxy_pass_request_headers on;
        }
    }
}
