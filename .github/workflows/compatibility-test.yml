name: Aster compatibility

on:
  pull_request:
    paths:
      - "compatibility/**"
      - "docker-compose.compatibility.yml"
      - "Dockerfile.integration"
      - "Dockerfile"
      - ".scripts/compatibility/**"
      - ".scripts/integration/**"
      - ".scripts/package.sh"
      - ".github/workflows/compatibility-test.yml"
      - "packages/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '10.15.1'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run compatibility lab
        run: bash .scripts/compatibility/run.sh
        env:
          ASTER_RUN_ROOT: ${{ runner.temp }}/aster-compatibility-evidence

      - name: Upload sanitized compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-compatibility-evidence
          path: ${{ runner.temp }}/aster-compatibility-evidence/run.*/evidence/*.json
          if-no-files-found: error
