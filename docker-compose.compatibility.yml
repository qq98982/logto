services:
  postgres-oracle:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ASTER_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-oracle:
    image: redis:6-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  aster-oracle:
    image: aster-reference:6852a7b8c
    build:
      context: ${ASTER_REFERENCE_CONTEXT:-.}
      dockerfile: Dockerfile.integration
    stop_signal: SIGINT
    volumes:
      - ${ASTER_ORACLE_MESSAGE_DIR:?required}:/tmp/logto
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-oracle:
        condition: service_healthy
      redis-oracle:
        condition: service_healthy
    environment:
      DB_URL: postgres://postgres:${ASTER_POSTGRES_PASSWORD:?required}@postgres-oracle:5432/postgres
      REDIS_URL: redis://redis-oracle:6379
      ENDPOINT: http://localhost:3101
      ADMIN_ENDPOINT: http://localhost:3201
      SECRET_VAULT_KEK: ${ASTER_SECRET_VAULT_KEK:?required}
      STATUS_API_KEY: ${ASTER_STATUS_API_KEY:?required}
      TRUST_PROXY_HEADER: "1"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3001 && nc -z localhost 3002 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60
    ports:
      - "127.0.0.1:3101:3001"
      - "127.0.0.1:3201:3002"

  postgres-candidate:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ASTER_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-candidate:
    image: redis:6-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  aster-candidate:
    image: ${ASTER_CANDIDATE_IMAGE:-aster-reference:6852a7b8c}
    stop_signal: SIGINT
    volumes:
      - ${ASTER_CANDIDATE_MESSAGE_DIR:?required}:/tmp/logto
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-candidate:
        condition: service_healthy
      redis-candidate:
        condition: service_healthy
    environment:
      DB_URL: postgres://postgres:${ASTER_POSTGRES_PASSWORD:?required}@postgres-candidate:5432/postgres
      REDIS_URL: redis://redis-candidate:6379
      ENDPOINT: http://localhost:3102
      ADMIN_ENDPOINT: http://localhost:3202
      SECRET_VAULT_KEK: ${ASTER_SECRET_VAULT_KEK:?required}
      STATUS_API_KEY: ${ASTER_STATUS_API_KEY:?required}
      TRUST_PROXY_HEADER: "1"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3001 && nc -z localhost 3002 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60
    ports:
      - "127.0.0.1:3102:3001"
      - "127.0.0.1:3202:3002"
