{
  "services": {
    "candidate-primary-postgres": {
      "image": "${ASTER_PHASE1_POSTGRES_IMAGE:?required}",
      "command": [
        "postgres",
        "-c", "max_prepared_transactions=0",
        "-c", "password_encryption=scram-sha-256",
        "-c", "log_statement=none",
        "-c", "log_duration=off",
        "-c", "log_min_duration_statement=-1",
        "-c", "log_min_error_statement=panic",
        "-c", "log_parameter_max_length=0",
        "-c", "log_parameter_max_length_on_error=0",
        "-c", "log_statement_sample_rate=0",
        "-c", "log_transaction_sample_rate=0"
      ],
      "environment": {
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "${ASTER_PHASE1_CANDIDATE_PRIMARY_POSTGRES_PASSWORD:?required}",
        "POSTGRES_DB": "postgres",
        "POSTGRES_INITDB_ARGS": "--auth-local=trust --auth-host=scram-sha-256",
        "ASTER_PHASE1_INIT_CIDR": "172.30.241.11/32",
        "ASTER_PHASE1_CORE_CIDR": "172.30.241.12/32",
        "ASTER_PHASE1_COORDINATOR_CIDR": "172.30.241.13/32"
      },
      "healthcheck": {
        "test": ["CMD-SHELL", "pg_isready -U postgres -d postgres"],
        "interval": "2s",
        "timeout": "3s",
        "retries": 60
      },
      "networks": {
        "candidate-primary": { "ipv4_address": "172.30.241.10" }
      },
      "volumes": [
        "candidate-primary-postgres:/var/lib/postgresql/data",
        "./.scripts/compatibility/phase1-candidate-postgres-init.sh:/docker-entrypoint-initdb.d/010-aster-phase1-hba.sh:ro"
      ]
    },
    "candidate-primary-init": {
      "image": "${ASTER_PHASE1_CANDIDATE_IMAGE:?required}",
      "command": ["init", "primary"],
      "depends_on": {
        "candidate-primary-postgres": { "condition": "service_healthy" }
      },
      "environment": {
        "ASTER_PHASE1_RUNTIME_UID": "${ASTER_PHASE1_RUNTIME_UID:?required}",
        "ASTER_PHASE1_RUNTIME_GID": "${ASTER_PHASE1_RUNTIME_GID:?required}",
        "ASTER_PHASE1_PRIMARY_CONFIG_FILE": "${ASTER_PHASE1_PRIMARY_CONFIG_FILE:?required}",
        "ASTER_PHASE1_PRIMARY_MASTER_KEY_FILE": "/var/lib/aster/primary/aster-master-key.json"
      },
      "networks": {
        "candidate-primary": { "ipv4_address": "172.30.241.11" }
      },
      "volumes": [
        "${ASTER_PHASE1_PRIMARY_CONFIG_FILE:?required}:${ASTER_PHASE1_PRIMARY_CONFIG_FILE:?required}:ro",
        "candidate-primary-keyring:/var/lib/aster/primary"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=${ASTER_PHASE1_RUNTIME_UID:?required},gid=${ASTER_PHASE1_RUNTIME_GID:?required},mode=0700",
        "/run/aster:rw,noexec,nosuid,nodev,size=16m,uid=${ASTER_PHASE1_RUNTIME_UID:?required},gid=${ASTER_PHASE1_RUNTIME_GID:?required},mode=0700"
      ],
      "user": "${ASTER_PHASE1_RUNTIME_UID:?required}:${ASTER_PHASE1_RUNTIME_GID:?required}",
      "userns_mode": "host",
      "read_only": true,
      "security_opt": ["no-new-privileges:true"],
      "restart": "no"
    },
    "candidate-primary-core": {
      "image": "${ASTER_PHASE1_CANDIDATE_IMAGE:?required}",
      "command": ["core", "primary"],
      "depends_on": {
        "candidate-primary-init": { "condition": "service_completed_successfully" }
      },
      "environment": {
        "ASTER_PHASE1_RUNTIME_UID": "${ASTER_PHASE1_RUNTIME_UID:?required}",
        "ASTER_PHASE1_RUNTIME_GID": "${ASTER_PHASE1_RUNTIME_GID:?required}",
        "ASTER_PHASE1_PRIMARY_CONFIG_FILE": "${ASTER_PHASE1_PRIMARY_CONFIG_FILE:?required}",
        "ASTER_PHASE1_PRIMARY_MASTER_KEY_FILE": "/var/lib/aster/primary/aster-master-key.json",
        "ASTER_PHASE1_DATA_ISSUER": "http://localhost:3321/oidc",
        "ASTER_PHASE1_ADMIN_ISSUER": "http://localhost:3421/oidc",
        "ASTER_PHASE1_ADMIN_ORIGIN": "http://localhost:3421"
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "test -f /run/aster/maintainer-ready && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' | nc -w 2 127.0.0.1 3001 | grep -q ' 200 OK' && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' | nc -w 2 127.0.0.1 3421 | grep -q ' 200 OK'"
        ],
        "interval": "2s",
        "timeout": "3s",
        "retries": 60
      },
      "networks": {
        "candidate-primary": { "ipv4_address": "172.30.241.12" },
        "candidate-connector-boundary": {},
        "candidate-saml-boundary": {},
        "candidate-script-boundary": {}
      },
      "volumes": [
        "${ASTER_PHASE1_PRIMARY_CONFIG_FILE:?required}:${ASTER_PHASE1_PRIMARY_CONFIG_FILE:?required}:ro",
        "candidate-primary-keyring:/var/lib/aster/primary:ro"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=${ASTER_PHASE1_RUNTIME_UID:?required},gid=${ASTER_PHASE1_RUNTIME_GID:?required},mode=0700",
        "/run/aster:rw,noexec,nosuid,nodev,size=16m,uid=${ASTER_PHASE1_RUNTIME_UID:?required},gid=${ASTER_PHASE1_RUNTIME_GID:?required},mode=0700"
      ],
      "user": "${ASTER_PHASE1_RUNTIME_UID:?required}:${ASTER_PHASE1_RUNTIME_GID:?required}",
      "userns_mode": "host",
      "read_only": true,
      "security_opt": ["no-new-privileges:true"],
      "stop_signal": "SIGTERM",
      "stop_grace_period": "20s"
    },
    "candidate-foreign-postgres": {
      "image": "${ASTER_PHASE1_POSTGRES_IMAGE:?required}",
      "command": [
        "postgres",
        "-c", "max_prepared_transactions=0",
        "-c", "password_encryption=scram-sha-256",
        "-c", "log_statement=none",
        "-c", "log_duration=off",
        "-c", "log_min_duration_statement=-1",
        "-c", "log_min_error_statement=panic",
        "-c", "log_parameter_max_length=0",
        "-c", "log_parameter_max_length_on_error=0",
        "-c", "log_statement_sample_rate=0",
        "-c", "log_transaction_sample_rate=0"
      ],
      "environment": {
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "${ASTER_PHASE1_CANDIDATE_FOREIGN_POSTGRES_PASSWORD:?required}",
        "POSTGRES_DB": "postgres",
        "POSTGRES_INITDB_ARGS": "--auth-local=trust --auth-host=scram-sha-256",
        "ASTER_PHASE1_INIT_CIDR": "172.30.242.11/32",
        "ASTER_PHASE1_CORE_CIDR": "172.30.242.12/32",
        "ASTER_PHASE1_COORDINATOR_CIDR": "172.30.242.13/32"
      },
      "healthcheck": {
        "test": ["CMD-SHELL", "pg_isready -U postgres -d postgres"],
        "interval": "2s",
        "timeout": "3s",
        "retries": 60
      },
      "networks": {
        "candidate-foreign": { "ipv4_address": "172.30.242.10" }
      },
      "volumes": [
        "candidate-foreign-postgres:/var/lib/postgresql/data",
        "./.scripts/compatibility/phase1-candidate-postgres-init.sh:/docker-entrypoint-initdb.d/010-aster-phase1-hba.sh:ro"
      ]
    },
    "candidate-foreign-init": {
      "image": "${ASTER_PHASE1_CANDIDATE_IMAGE:?required}",
      "command": ["init", "foreign"],
      "depends_on": {
        "candidate-foreign-postgres": { "condition": "service_healthy" }
      },
      "environment": {
        "ASTER_PHASE1_RUNTIME_UID": "${ASTER_PHASE1_RUNTIME_UID:?required}",
        "ASTER_PHASE1_RUNTIME_GID": "${ASTER_PHASE1_RUNTIME_GID:?required}",
        "ASTER_PHASE1_FOREIGN_CONFIG_FILE": "${ASTER_PHASE1_FOREIGN_CONFIG_FILE:?required}",
        "ASTER_PHASE1_FOREIGN_MASTER_KEY_FILE": "/var/lib/aster/foreign/aster-master-key.json"
      },
      "networks": {
        "candidate-foreign": { "ipv4_address": "172.30.242.11" }
      },
      "volumes": [
        "${ASTER_PHASE1_FOREIGN_CONFIG_FILE:?required}:${ASTER_PHASE1_FOREIGN_CONFIG_FILE:?required}:ro",
        "candidate-foreign-keyring:/var/lib/aster/foreign"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=${ASTER_PHASE1_RUNTIME_UID:?required},gid=${ASTER_PHASE1_RUNTIME_GID:?required},mode=0700",
        "/run/aster:rw,noexec,nosuid,nodev,size=16m,uid=${ASTER_PHASE1_RUNTIME_UID:?required},gid=${ASTER_PHASE1_RUNTIME_GID:?required},mode=0700"
      ],
      "user": "${ASTER_PHASE1_RUNTIME_UID:?required}:${ASTER_PHASE1_RUNTIME_GID:?required}",
      "userns_mode": "host",
      "read_only": true,
      "security_opt": ["no-new-privileges:true"],
      "restart": "no"
    },
    "candidate-foreign-core": {
      "image": "${ASTER_PHASE1_CANDIDATE_IMAGE:?required}",
      "command": ["core", "foreign"],
      "depends_on": {
        "candidate-foreign-init": { "condition": "service_completed_successfully" }
      },
      "environment": {
        "ASTER_PHASE1_RUNTIME_UID": "${ASTER_PHASE1_RUNTIME_UID:?required}",
        "ASTER_PHASE1_RUNTIME_GID": "${ASTER_PHASE1_RUNTIME_GID:?required}",
        "ASTER_PHASE1_FOREIGN_CONFIG_FILE": "${ASTER_PHASE1_FOREIGN_CONFIG_FILE:?required}",
        "ASTER_PHASE1_FOREIGN_MASTER_KEY_FILE": "/var/lib/aster/foreign/aster-master-key.json",
        "ASTER_PHASE1_DATA_ISSUER": "http://localhost:3322/oidc",
        "ASTER_PHASE1_ADMIN_ISSUER": "http://localhost:3422/oidc",
        "ASTER_PHASE1_ADMIN_ORIGIN": "http://localhost:3002"
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "test -f /run/aster/maintainer-ready && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' | nc -w 2 127.0.0.1 3001 | grep -q ' 200 OK' && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' | nc -w 2 127.0.0.1 3002 | grep -q ' 200 OK'"
        ],
        "interval": "2s",
        "timeout": "3s",
        "retries": 60
      },
      "networks": {
        "candidate-foreign": { "ipv4_address": "172.30.242.12" }
      },
      "volumes": [
        "${ASTER_PHASE1_FOREIGN_CONFIG_FILE:?required}:${ASTER_PHASE1_FOREIGN_CONFIG_FILE:?required}:ro",
        "candidate-foreign-keyring:/var/lib/aster/foreign:ro"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=${ASTER_PHASE1_RUNTIME_UID:?required},gid=${ASTER_PHASE1_RUNTIME_GID:?required},mode=0700",
        "/run/aster:rw,noexec,nosuid,nodev,size=16m,uid=${ASTER_PHASE1_RUNTIME_UID:?required},gid=${ASTER_PHASE1_RUNTIME_GID:?required},mode=0700"
      ],
      "user": "${ASTER_PHASE1_RUNTIME_UID:?required}:${ASTER_PHASE1_RUNTIME_GID:?required}",
      "userns_mode": "host",
      "read_only": true,
      "security_opt": ["no-new-privileges:true"],
      "stop_signal": "SIGTERM",
      "stop_grace_period": "20s"
    },
    "candidate-fixture-coordinator": {
      "image": "${ASTER_PHASE1_CANDIDATE_IMAGE:?required}",
      "command": ["fixture-coordinator"],
      "depends_on": {
        "candidate-primary-init": { "condition": "service_completed_successfully" },
        "candidate-foreign-init": { "condition": "service_completed_successfully" },
        "candidate-primary-core": { "condition": "service_healthy" },
        "candidate-foreign-core": { "condition": "service_healthy" }
      },
      "environment": {
        "ASTER_PHASE1_RUNTIME_UID": "${ASTER_PHASE1_RUNTIME_UID:?required}",
        "ASTER_PHASE1_RUNTIME_GID": "${ASTER_PHASE1_RUNTIME_GID:?required}",
        "ASTER_PHASE1_PRIMARY_CONFIG_FILE": "${ASTER_PHASE1_PRIMARY_CONFIG_FILE:?required}",
        "ASTER_PHASE1_FOREIGN_CONFIG_FILE": "${ASTER_PHASE1_FOREIGN_CONFIG_FILE:?required}",
        "ASTER_PHASE1_PRIMARY_MASTER_KEY_FILE": "/var/lib/aster/primary/aster-master-key.json",
        "ASTER_PHASE1_FOREIGN_MASTER_KEY_FILE": "/var/lib/aster/foreign/aster-master-key.json",
        "ASTER_FIXTURE_SOCKET": "${ASTER_PHASE1_FIXTURE_SOCKET:?required}"
      },
      "healthcheck": {
        "test": ["CMD-SHELL", "test -S \"$${ASTER_FIXTURE_SOCKET}\""],
        "interval": "1s",
        "timeout": "2s",
        "retries": 60
      },
      "networks": {
        "candidate-primary": { "ipv4_address": "172.30.241.13" },
        "candidate-foreign": { "ipv4_address": "172.30.242.13" }
      },
      "volumes": [
        "${ASTER_PHASE1_PRIMARY_CONFIG_FILE:?required}:${ASTER_PHASE1_PRIMARY_CONFIG_FILE:?required}:ro",
        "${ASTER_PHASE1_FOREIGN_CONFIG_FILE:?required}:${ASTER_PHASE1_FOREIGN_CONFIG_FILE:?required}:ro",
        "candidate-primary-keyring:/var/lib/aster/primary:ro",
        "candidate-foreign-keyring:/var/lib/aster/foreign:ro",
        "${ASTER_PHASE1_FIXTURE_DIRECTORY:?required}:${ASTER_PHASE1_FIXTURE_DIRECTORY:?required}:rw"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=${ASTER_PHASE1_RUNTIME_UID:?required},gid=${ASTER_PHASE1_RUNTIME_GID:?required},mode=0700",
        "/run/aster:rw,noexec,nosuid,nodev,size=16m,uid=${ASTER_PHASE1_RUNTIME_UID:?required},gid=${ASTER_PHASE1_RUNTIME_GID:?required},mode=0700"
      ],
      "user": "${ASTER_PHASE1_RUNTIME_UID:?required}:${ASTER_PHASE1_RUNTIME_GID:?required}",
      "userns_mode": "host",
      "read_only": true,
      "security_opt": ["no-new-privileges:true"],
      "stop_signal": "SIGTERM",
      "stop_grace_period": "20s"
    },
    "candidate-connector-host": {
      "image": "${ASTER_PHASE1_HOST_FIXTURE_IMAGE:?required}",
      "entrypoint": ["/bin/sh", "-c"],
      "command": ["trap 'exit 0' TERM INT; while :; do sleep 60; done"],
      "environment": {
        "ASTER_HOST_KIND": "connector",
        "ASTER_HOST_PEER_ID": "spiffe://aster.test/connector",
        "ASTER_HOST_PROTOCOL_VERSION": "1"
      },
      "networks": ["candidate-connector-boundary"],
      "tmpfs": ["/tmp:rw,noexec,nosuid,nodev,size=16m"],
      "user": "${ASTER_PHASE1_RUNTIME_UID:?required}:${ASTER_PHASE1_RUNTIME_GID:?required}",
      "userns_mode": "host",
      "read_only": true,
      "security_opt": ["no-new-privileges:true"],
      "restart": "no"
    },
    "candidate-saml-host": {
      "image": "${ASTER_PHASE1_HOST_FIXTURE_IMAGE:?required}",
      "entrypoint": ["/bin/sh", "-c"],
      "command": ["trap 'exit 0' TERM INT; while :; do sleep 60; done"],
      "environment": {
        "ASTER_HOST_KIND": "saml",
        "ASTER_HOST_PEER_ID": "spiffe://aster.test/connector",
        "ASTER_HOST_PROTOCOL_VERSION": "1"
      },
      "networks": ["candidate-saml-boundary"],
      "tmpfs": ["/tmp:rw,noexec,nosuid,nodev,size=16m"],
      "user": "${ASTER_PHASE1_RUNTIME_UID:?required}:${ASTER_PHASE1_RUNTIME_GID:?required}",
      "userns_mode": "host",
      "read_only": true,
      "security_opt": ["no-new-privileges:true"],
      "restart": "no"
    },
    "candidate-script-host": {
      "image": "${ASTER_PHASE1_HOST_FIXTURE_IMAGE:?required}",
      "entrypoint": ["/bin/sh", "-c"],
      "command": ["trap 'exit 0' TERM INT; while :; do sleep 60; done"],
      "environment": {
        "ASTER_HOST_KIND": "script",
        "ASTER_HOST_PEER_ID": "spiffe://aster.test/script",
        "ASTER_HOST_PROTOCOL_VERSION": "2"
      },
      "networks": ["candidate-script-boundary"],
      "tmpfs": ["/tmp:rw,noexec,nosuid,nodev,size=16m"],
      "user": "${ASTER_PHASE1_RUNTIME_UID:?required}:${ASTER_PHASE1_RUNTIME_GID:?required}",
      "userns_mode": "host",
      "read_only": true,
      "security_opt": ["no-new-privileges:true"],
      "restart": "no"
    }
  },
  "networks": {
    "candidate-primary": {
      "internal": true,
      "ipam": { "config": [{ "subnet": "172.30.241.0/24" }] }
    },
    "candidate-foreign": {
      "internal": true,
      "ipam": { "config": [{ "subnet": "172.30.242.0/24" }] }
    },
    "candidate-connector-boundary": {
      "internal": true,
      "ipam": { "config": [{ "subnet": "172.30.244.0/24" }] }
    },
    "candidate-saml-boundary": {
      "internal": true,
      "ipam": { "config": [{ "subnet": "172.30.245.0/24" }] }
    },
    "candidate-script-boundary": {
      "internal": true,
      "ipam": { "config": [{ "subnet": "172.30.246.0/24" }] }
    }
  },
  "volumes": {
    "candidate-primary-postgres": {},
    "candidate-foreign-postgres": {},
    "candidate-primary-keyring": {
      "driver": "local",
      "driver_opts": {
        "type": "none",
        "o": "bind",
        "device": "${ASTER_PHASE1_PRIMARY_KEYRING_DIRECTORY:?required}"
      }
    },
    "candidate-foreign-keyring": {
      "driver": "local",
      "driver_opts": {
        "type": "none",
        "o": "bind",
        "device": "${ASTER_PHASE1_FOREIGN_KEYRING_DIRECTORY:?required}"
      }
    }
  }
}
