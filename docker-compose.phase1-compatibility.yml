      "security_opt": ["no-new-privileges:true"],
      "tmpfs": ["/tmp:rw,noexec,nosuid,size=64m"],
      "environment": { "ASTER_CORE_URL": "http://candidate-primary-core:3001" },
      "networks": ["candidate-script-boundary"]
