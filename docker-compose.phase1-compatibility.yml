        "SECRET_VAULT_KEK": "${ASTER_PHASE1_CANDIDATE_PHASE0_SECRET_VAULT_KEK:?required}",
        "STATUS_API_KEY": "${ASTER_PHASE1_CANDIDATE_PHASE0_STATUS_API_KEY:?required}",
