        "candidate-phase0-postgres": { "condition": "service_healthy" },
        "candidate-phase0-redis": { "condition": "service_healthy" }
      },
      "environment": {
        "DB_URL": "postgres://aster:${ASTER_PHASE1_CANDIDATE_PHASE0_POSTGRES_PASSWORD:?required}@candidate-phase0-postgres:5432/aster",
        "REDIS_URL": "redis://candidate-phase0-redis:6379",
