{
  "services": {
    "oracle-primary-postgres": {
      "image": "${ASTER_PHASE1_POSTGRES_IMAGE:?required}",
      "environment": {
        "POSTGRES_USER": "aster",
        "POSTGRES_PASSWORD": "${ASTER_PHASE1_ORACLE_PRIMARY_POSTGRES_PASSWORD:?required}",
        "POSTGRES_DB": "aster"
      },
      "healthcheck": {
        "test": ["CMD-SHELL", "pg_isready -U aster -d aster"],
        "interval": "3s",
        "timeout": "3s",
        "retries": 40
      },
      "networks": ["oracle-primary"],
      "volumes": ["oracle-primary-postgres:/var/lib/postgresql/data"]
    },
    "oracle-primary-redis": {
      "image": "${ASTER_PHASE1_REDIS_IMAGE:?required}",
      "command": ["redis-server", "--appendonly", "yes"],
      "healthcheck": {
        "test": ["CMD", "redis-cli", "ping"],
        "interval": "3s",
        "timeout": "3s",
        "retries": 40
      },
      "networks": ["oracle-primary"],
      "volumes": ["oracle-primary-redis:/data"]
    },
    "oracle-primary-core": {
      "image": "${ASTER_PHASE1_ORACLE_IMAGE:?required}",
      "stop_signal": "SIGINT",
      "depends_on": {
        "oracle-primary-postgres": { "condition": "service_healthy" },
        "oracle-primary-redis": { "condition": "service_healthy" }
      },
      "environment": {
        "DB_URL": "postgres://aster:${ASTER_PHASE1_ORACLE_PRIMARY_POSTGRES_PASSWORD:?required}@oracle-primary-postgres:5432/aster",
        "REDIS_URL": "redis://oracle-primary-redis:6379",
        "ENDPOINT": "http://localhost:3311",
        "ADMIN_ENDPOINT": "http://localhost:3411",
        "ADMIN_PORT": "3411",
        "SECRET_VAULT_KEK": "${ASTER_PHASE1_ORACLE_PRIMARY_SECRET_VAULT_KEK:?required}",
        "STATUS_API_KEY": "${ASTER_PHASE1_ORACLE_PRIMARY_STATUS_API_KEY:?required}",
        "TRUST_PROXY_HEADER": "1"
      },
      "healthcheck": {
        "test": ["CMD-SHELL", "nc -z localhost 3001 && nc -z localhost 3411"],
        "interval": "3s",
        "timeout": "3s",
        "retries": 80
      },
      "networks": ["oracle-primary"]
    },
    "oracle-foreign-postgres": {
      "image": "${ASTER_PHASE1_POSTGRES_IMAGE:?required}",
      "environment": {
        "POSTGRES_USER": "aster",
        "POSTGRES_PASSWORD": "${ASTER_PHASE1_ORACLE_FOREIGN_POSTGRES_PASSWORD:?required}",
        "POSTGRES_DB": "aster"
      },
      "healthcheck": {
        "test": ["CMD-SHELL", "pg_isready -U aster -d aster"],
        "interval": "3s",
        "timeout": "3s",
        "retries": 40
      },
      "networks": ["oracle-foreign"],
      "volumes": ["oracle-foreign-postgres:/var/lib/postgresql/data"]
    },
    "oracle-foreign-redis": {
      "image": "${ASTER_PHASE1_REDIS_IMAGE:?required}",
      "command": ["redis-server", "--appendonly", "yes"],
      "healthcheck": {
        "test": ["CMD", "redis-cli", "ping"],
        "interval": "3s",
        "timeout": "3s",
        "retries": 40
      },
      "networks": ["oracle-foreign"],
      "volumes": ["oracle-foreign-redis:/data"]
    },
    "oracle-foreign-core": {
      "image": "${ASTER_PHASE1_ORACLE_IMAGE:?required}",
      "stop_signal": "SIGINT",
      "depends_on": {
        "oracle-foreign-postgres": { "condition": "service_healthy" },
        "oracle-foreign-redis": { "condition": "service_healthy" }
      },
      "environment": {
        "DB_URL": "postgres://aster:${ASTER_PHASE1_ORACLE_FOREIGN_POSTGRES_PASSWORD:?required}@oracle-foreign-postgres:5432/aster",
        "REDIS_URL": "redis://oracle-foreign-redis:6379",
        "ENDPOINT": "http://localhost:3312",
        "ADMIN_ENDPOINT": "http://localhost:3412",
        "ADMIN_PORT": "3002",
        "SECRET_VAULT_KEK": "${ASTER_PHASE1_ORACLE_FOREIGN_SECRET_VAULT_KEK:?required}",
        "STATUS_API_KEY": "${ASTER_PHASE1_ORACLE_FOREIGN_STATUS_API_KEY:?required}",
        "TRUST_PROXY_HEADER": "1"
      },
      "healthcheck": {
        "test": ["CMD-SHELL", "nc -z localhost 3001 && nc -z localhost 3002"],
        "interval": "3s",
        "timeout": "3s",
        "retries": 80
      },
      "networks": ["oracle-foreign"]
    },
    "candidate-primary-postgres": {
      "image": "${ASTER_PHASE1_POSTGRES_IMAGE:?required}",
      "environment": {
        "POSTGRES_USER": "aster",
        "POSTGRES_PASSWORD": "${ASTER_PHASE1_CANDIDATE_PRIMARY_POSTGRES_PASSWORD:?required}",
        "POSTGRES_DB": "aster"
