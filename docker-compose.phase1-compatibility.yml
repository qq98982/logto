        "test": ["CMD", "redis-cli", "ping"],
        "interval": "3s",
        "timeout": "3s",
        "retries": 40
      },
      "networks": ["candidate-primary"],
      "volumes": ["candidate-primary-redis:/data"]
    },
    "candidate-primary-core": {
      "image": "${ASTER_PHASE1_CANDIDATE_IMAGE:?required}",
      "stop_signal": "SIGINT",
      "depends_on": {
        "candidate-primary-postgres": { "condition": "service_healthy" },
        "candidate-primary-redis": { "condition": "service_healthy" }
      },
      "environment": {
        "DB_URL": "postgres://aster:${ASTER_PHASE1_CANDIDATE_PRIMARY_POSTGRES_PASSWORD:?required}@candidate-primary-postgres:5432/aster",
        "REDIS_URL": "redis://candidate-primary-redis:6379",
        "ENDPOINT": "http://localhost:3321",
        "ADMIN_ENDPOINT": "http://localhost:3421",
        "ADMIN_PORT": "3421",
        "SECRET_VAULT_KEK": "${ASTER_PHASE1_CANDIDATE_PRIMARY_SECRET_VAULT_KEK:?required}",
        "STATUS_API_KEY": "${ASTER_PHASE1_CANDIDATE_PRIMARY_STATUS_API_KEY:?required}",
        "TRUST_PROXY_HEADER": "1"
      },
      "healthcheck": {
        "test": ["CMD-SHELL", "nc -z localhost 3001 && nc -z localhost 3421"],
        "interval": "3s",
        "timeout": "3s",
        "retries": 80
      },
      "networks": [
        "candidate-primary",
        "candidate-connector-boundary",
        "candidate-saml-boundary",
        "candidate-script-boundary"
      ]
    },
    "candidate-foreign-postgres": {
      "image": "${ASTER_PHASE1_POSTGRES_IMAGE:?required}",
      "environment": {
        "POSTGRES_USER": "aster",
        "POSTGRES_PASSWORD": "${ASTER_PHASE1_CANDIDATE_FOREIGN_POSTGRES_PASSWORD:?required}",
