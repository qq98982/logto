        "ADMIN_PORT": "3002",
        "SECRET_VAULT_KEK": "${ASTER_PHASE1_CANDIDATE_FOREIGN_SECRET_VAULT_KEK:?required}",
        "STATUS_API_KEY": "${ASTER_PHASE1_CANDIDATE_FOREIGN_STATUS_API_KEY:?required}",
        "TRUST_PROXY_HEADER": "1"
      },
      "healthcheck": {
        "test": ["CMD-SHELL", "nc -z localhost 3001 && nc -z localhost 3002"],
        "interval": "3s",
