        "retries": 80
      },
      "networks": ["candidate-foreign"]
    },
    "oracle-phase0-postgres": {
      "image": "${ASTER_PHASE1_POSTGRES_IMAGE:?required}",
      "environment": {
        "POSTGRES_USER": "aster",
