  "networks": {
    "oracle-primary": { "internal": true },
    "oracle-foreign": { "internal": true },
    "candidate-primary": { "internal": true },
    "candidate-foreign": { "internal": true },
    "oracle-phase0": { "internal": true },
    "candidate-phase0": { "internal": true },
    "candidate-connector-boundary": { "internal": true },
    "candidate-saml-boundary": { "internal": true },
    "candidate-script-boundary": { "internal": true }
  },
  "volumes": {
    "oracle-primary-postgres": {},
    "oracle-primary-redis": {},
    "oracle-foreign-postgres": {},
